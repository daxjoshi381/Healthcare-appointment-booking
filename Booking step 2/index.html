<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>booking</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <div class="top">
            <div class="left-name">
                <img src="../assets/img/musaki.png" alt="">
                <h2>Musaki</h2>
            </div>

            <div class="right-section">
                <p>Musaki Professional</p>

                <div class="btn-section">
                    <a href="#">Entrar</a>
                    <button class="btn-reg">Registro</button>
                </div>
            </div>
        </div>

    </header>
    <section>

        <div class="appointment-container">
            <!-- Left Side: Doctor Details -->
            <div class="details-section">
                <button class="back-btn">&larr;</button>

                <div class="info-group">
                    <div class="info">
                        <i class="fa-solid fa-stethoscope"></i>
                        <p>Dr. Steven John</p>
                    </div>

                    <div class="info">
                        <i class="fa-regular fa-clock"></i>
                        <p>30 mins</p>
                    </div>

                    <div class="info">
                        <i class="fa-solid fa-video"></i>
                        <p>Video call details provided upon successful confirmation</p>
                    </div>

                    <div class="info">
                        <i class="fa-solid fa-hand-holding-dollar"></i>
                        <p>Fees: zł150 </p>
                    </div>

                    <div class="info">
                        <i class="fa-solid fa-calendar-minus"></i>
                        <p>02:30pm - 03:00pm, Thursday, August 10th</p>
                    </div>
                </div>
            </div>


            <div class="enter-section">
                <h3>Enter Details</h3>
                <div class="Patients-Name">
                    <h4>Patient’s Name</h4>
                    <input type="gmail" placeholder="steve.madden@gmail.com">
                </div>

                <div class="Contact-Number">
                    <h4>Contact Number</h4>
                    <input type="tel" placeholder="Enter Mobile Number">

                </div>

                <div class="Problem">
                    <h4>Problem</h4>
                    <input type="text" placeholder="" hidden>
                </div>

                <div class="payment-details">
                    <h4>Payment Details</h4>
                    <div class="payment-option"> <input type="radio" name="payment" value="paypal" checked>
                        <span>Paypal</span> </div>
                    <div class="payment-option"> <input type="radio" name="payment" value="paytm"> <span>Paytm</span>
                    </div>
                    <div class="payment-option"> <input type="radio" name="payment" value="credit-card"> <span>Credit
                            Card</span> </div>
                </div>



            </div>
        </div>
        <div class="btn">
            <button class="btn-reg">Confirm</button>
        </div>

    </section>




</body>

</html>
