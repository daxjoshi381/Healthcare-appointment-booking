<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>booking</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="des-bord">
        <div class="side-bar">
            <div class="logo">
                <img src="./assets/img/color-logo.png" alt="">
                <h2>Healthi</h2>
            </div>

            <div class="side-menu">
                <button class="activ">
                    <img src="./assets/img/CirclesFour.png" alt="">
                    <a href="#" style="color: white;">Dasbord</a>
                </button>

                <button>
                    <a href="#">Calendar</a>
                </button>

                <button>
                    <a href="#">Profile</a>
                </button>

                <button>
                    <a href="#">Help</a>
                </button>

                <button>
                    <a href="#">Logout</a>
                </button>
            </div>

            <div class="img-bottom">
                <img src="./assets/img/get-faster.png" alt="">
                <div class="bottom-title">
                    <h3>Get faste <br>and better <br> Healthcare</h3>
                    <button class="btn-bott">Go pro</button>
                </div>
            </div>
        </div>
        <main class="main-content">
            <div class="top-heding">
                <div class="left">
                    <p>Hi, Stevan dux</p>
                    <h2>Online Consul</h2>

                </div>
                <div class="right">
                    <button class="language" type="button">
                        EN <i class="fa-solid fa-chevron-down"></i>
                    </button>
                    <button class="notification" type="button">
                        <img src="./assets/img/Bell.png" alt="">
                    </button>
                    <div class="user-mini">
                        <img src="./assets/img/user.png" alt="User">
                        <span>Steven dux</span>
                    </div>

                </div>
            </div>

            <div class="Consultation">
                <div class="Consultation-info">
                    <h1>Consultation Info</h1>

                    <div class="availability-section">
                        <div class="availability">
                            <p>Availability</p>
                            <div class="Disable-enable">
                                <div class="disable">
                                    <input type="radio" name="availability" value="disable">
                                    <span>Disable</span>
                                </div>
                                <div class="enable">
                                    <input type="radio" name="availability" value="enable" checked>
                                    <span>Enable</span>
                                </div>
                            </div>
                        </div>

                        <div class="type-section">
                            <p>Type Of Availability</p>
                            <div class="type-options">
                                <div class="availability-option">
                                    <input type="checkbox" name="availability-type" value="text">
                                    <span>Text</span>
                                </div>

                                <div class="availability-option">
                                    <input type="checkbox" name="availability-type" value="video">
                                    <span>Video</span>
                                </div>

                                <div class="availability-option">
                                    <input type="checkbox" name="availability-type" value="call">
                                    <span>Call</span>
                                </div>
                            </div>
                        </div>

                        <div class="Duration-section">
                            <p>Duration</p>
                            <div class="duration-time">
                                <p>30 mins</p>
                                <i class="fa-solid fa-chevron-down"></i>
                            </div>
                        </div>

                        <div class="Fees-section">
                            <p>Fees</p>
                            <div class="Fees-option">
                               <p>zł 500</p>
                            </div>
                        </div>

                    </div>

                    <div class="btn-section">
                        
                            <button class="Cancel">Cancel</button>
                            <button class="Save">Save</button>
                        
                    </div>
                </div>
            </div>

        </main>
