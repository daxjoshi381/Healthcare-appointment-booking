<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Before Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
        integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <header>
        <div class="nav-bar flex align-center space-between">
            <div class="left flex align-center">
                <img src="../assets/img/color-logo.png" alt="">
                <span>Healthi</span>
            </div>

            <div class="right flex align-center">
                <a href="#" style="color: #00000073;">Go Pro</a>
                <a href="#">Login</a>
                <button class="btn-reg">Register</button>
            </div>
        </div>
    </header>

    <section>
        <div class="container">
            <div class="banner">
                <!-- <img src="./desbord.png" alt=""> -->
                <div class="content flex">
                    <div class="title flex">
                        <h1>No need to visit local hospitals
                            Get your consultation online</h1>
                        <p>Audio/text/video/in-person</p>
                    </div>

                    <div class="doctor-online flex align-center">

                        <img src="../assets/img/online-dr.png" alt="">

                        <img src="../assets/img/online-dr (2).png" alt="" style="margin-left: -25px;">
                        <img src="../assets/img/online-dr (3).png" alt="" style="margin-left: -25px;">

                        <span>+180 doctors are online</span>
                    </div>
                </div>

                <div class="dr-img">
                    <img src="../assets/img/dash-dr.png" alt="">
                </div>
            </div>

        </div>
    </section>
    <section style="position: relative;">
        <div class="container">
            <div class="search-bar flex align-center center">
                <div class="left-input flex align-center">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" placeholder="Find doctors">
                </div>

                <div class="right-input flex align-center">
                    <div class="location-input flex align-center">
                        <i class="fa-solid fa-location-dot"></i>
                        <input type="text" placeholder="Location">
                    </div>

                    <div class="settings-icon">
                        <i class="fa-solid fa-crosshairs"></i>
                    </div>

                    <button class="search-btn">Search</button>
                </div>
            </div>
        </div>
    </section>

    <div class="dots container center">
        <span></span>
        <span></span>
        <span></span>
    </div>
</body>

</html>
