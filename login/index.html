<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
        integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <div class="login flex">
        <div class="left">
            <div class="bg-circle"></div>

            <div class="logo flex">
                <img src="../assets/img/logo.png" alt="">
                <span>Healthi</span>
            </div>

            <div class="box-1">
                <i class="fa-solid fa-magnifying-glass"></i>
                <div class="qualified-text flex">
                    <h5>Well qualified doctors</h5>
                    <p>Treat with atmost care</p>
                </div>
            </div>

            <div class="doctor-image">
                <img src="../assets/img/dr.png" alt="Healthcare Doctors">
            </div>


            <div class="box-1 book">
                <i class="fa-regular fa-calendar-days"></i>
                <div class="qualified-text flex">
                    <h5>Book an appointment</h5>
                    <p>Call/text/video/in-person</p>
                </div>
            </div>
        </div>

        <div class="right flex center">
            <button class="close-btn"><i class="fa-solid fa-xmark"></i></button>

            <div class="login-box">
                <div class="box-heding">
                    <h1>Welcome back</h1>
                    <p class="signup-text">
                        New to Healthi?
                        <a href="#">Sign up</a>
                    </p>
                </div>

                <div class="box-email">
                    <p>Email address</p>
                    <input type="email" placeholder="Email address">
                </div>
            </div>
        </div>
    </div>

</body>

</html>
