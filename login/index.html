
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Musaki</title>
    
    <link href="https://googleapis.com" rel="stylesheet">
    
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
        integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="https://cloudflare.com">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        
        <div class="left-section">
            <img src="../assets/img/Frame 5.png" alt="">
            <img src="../assets/img/dr.png" alt="Doctor" class="dr-img">
        </div>

        
        <div class="right-section">
            
            <button class="close-btn"><i class="fa-solid fa-xmark"></i></button>

            <div class="login-box">
                
                <div class="form-header">
                    <h1>Welcome back</h1>
                    <p>New to Musaki? <a href="#" class="signup-link">Sign up</a></p>
                </div>

             
                <form>
                    <div class="input-group">
                        <label for="email">Email address</label>
                        <input type="email" id="email" placeholder="Email address" required>
                    </div>

                    
                    <div class="input-group password-group">
                        <label for="password">Your password</label>
                        <div class="input-wrapper">
                            <input type="password" id="password" value="•••••••••••••" required>
                            <i class="fa-regular fa-eye eye-icon"></i>
                        </div>
                    </div>

                   
                    <button type="submit" class="login-btn">Log in</button>

                    
                    <div class="form-options">
                        <label class="remember-me">
                            <input type="checkbox">
                            <span>Remember me</span>
                        </label>
                        <a href="#" class="forgot-link">Forgot password?</a>
                    </div>
                </form>

                
                <div class="social-login">
                    <p class="divider-text">Or log in with</p>
                    <div class="social-buttons">
                        <button class="social-btn"><i class="fa-brands fa-google" style="color: #4285F4;"></i></button>
                        <button class="social-btn"><i class="fa-brands fa-facebook-f" style="color: #1877F2;"></i></button>
                        <button class="social-btn"><i class="fa-brands fa-apple" style="color: #000000;"></i></button>
                    </div>
                </div>

            </div>
        </div>
    </div>
</body>
</html>
